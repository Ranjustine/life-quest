<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16121a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life Quest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#16121a;--panel:#211a27;--edge:#5a4630;--gold:#d2a84e;--txt:#eadfc4;--dim:#9a8c78;--red:#a8344a;--teal:#4a9a8e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:18px/1.45 'Crimson Pro',Georgia,serif;padding-bottom:84px}
h1,h2,h3,.cz{font-family:Cinzel,Georgia,serif;font-weight:700;letter-spacing:.04em}
main{max-width:560px;margin:0 auto;padding:16px}
h2{font-size:1.25rem;color:var(--gold);margin:20px 0 8px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:center}
.card .b{flex:1;min-width:0}.card .t{font-weight:600}.card .s{color:var(--dim);font-size:.9rem}
.done{opacity:.5}.done .t{text-decoration:line-through}
.bar{height:8px;background:#0e0b11;border:1px solid var(--edge);border-radius:2px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--gold)}.bar.t i{background:var(--teal)}.bar.r i{background:var(--red)}
button{font:inherit;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:6px 12px;min-height:40px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button.p{background:var(--gold);color:#1a1208;font-weight:600}
button.x{border-color:transparent;color:var(--dim);padding:6px 8px}
.hero{text-align:center;border:1px solid var(--gold);background:linear-gradient(#2a2030,#1c1622);padding:18px 12px;border-radius:4px}
.hero .lv{font:700 3rem/1 Cinzel,Georgia,serif;color:var(--gold)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0f0c12;border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;color:var(--dim);min-height:56px;font-size:.85rem}
nav button[aria-current=true]{color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}
#sheet{position:fixed;inset:0;background:rgba(5,3,8,.8);display:none;align-items:flex-end;z-index:20}
#sheet.on{display:flex}
#sheet form,#sheet .in{background:var(--panel);border-top:2px solid var(--gold);width:100%;max-width:560px;margin:0 auto;padding:16px;max-height:88%;overflow:auto}
label{display:block;color:var(--dim);font-size:.9rem;margin-top:10px}
input,select,textarea{width:100%;font:inherit;background:#0e0b11;color:var(--txt);border:1px solid var(--edge);border-radius:3px;padding:8px;min-height:40px}
.chk{display:flex;gap:8px;align-items:center;color:var(--txt);margin-top:6px}.chk input{width:auto;min-height:0}
.chk .n{width:64px;margin-left:auto}
.empty{color:var(--dim);text-align:center;padding:18px}
.ico{font-size:1.8rem;width:40px;text-align:center}.lock{filter:grayscale(1);opacity:.4}
.row{display:flex;justify-content:space-between;align-items:center}
</style></head><body>
<main id="v"></main>
<div id="sheet"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const day=d=>(d||new Date()).toLocaleDateString('en-CA');
const yest=()=>{const d=new Date();d.setDate(d.getDate()-1);return day(d)};
let S={tasks:[],habits:[],quests:[],ach:[],skills:[],goal:0,xp:0};
try{const r=localStorage.getItem('lifequest');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('lifequest',JSON.stringify(S))}catch(e){}};
let tab='hero';
const TABS=[['hero','Hero'],['tasks','Tasks'],['habits','Habits'],['quests','Quests'],['ach','Trophies']];
const lvl=x=>Math.floor(Math.sqrt(x/40))+1, need=l=>(l-1)*(l-1)*40;
const bar=(x,cls='')=>{const l=lvl(x),a=need(l),b=need(l+1);return `<div class="bar ${cls}"><i style="width:${Math.round((x-a)/(b-a)*100)}%"></i></div>`};
const DIFF=['','Easy +10 XP','Medium +20 XP','Hard +30 XP'];
const skillOpts=()=>'<option value="">No skill</option>'+S.skills.map(s=>`<option value="${s.id}">${E(s.name)}</option>`).join('');
const diffOpts=()=>[1,2,3].map(d=>`<option value="${d}">${DIFF[d]}</option>`).join('');

function award(diff,skill){const x=diff*10;S.xp+=x;const k=S.skills.find(s=>s.id===skill);if(k)k.xp+=x}
function met(c){
  if(c.type==='task'){const t=S.tasks.find(t=>t.id===c.ref);return !!(t&&t.done)}
  if(c.type==='project'){const p=S.tasks.filter(t=>t.project===c.ref);return p.length>0&&p.every(t=>t.done)}
  const h=S.habits.find(h=>h.id===c.ref);return !!(h&&h.best>=c.n)}
function check(){
  S.quests.forEach(q=>{if(!q.done&&q.conds.length&&q.conds.every(met)){q.done=true;q.doneAt=day();S.xp+=50;
    S.ach.forEach(a=>{if(a.quest===q.id&&!a.got)a.got=day()})}})}
function doTask(id){const t=S.tasks.find(t=>t.id===id);if(!t||t.done)return;t.done=true;t.doneAt=day();award(t.diff,t.skill);check();save();draw()}
function doHabit(id){const h=S.habits.find(h=>h.id===id);if(!h||h.last===day())return;
  h.streak=h.last===yest()?h.streak+1:1;h.last=day();h.best=Math.max(h.best,h.streak);award(h.diff,h.skill);check();save();draw()}
function claim(id){const a=S.ach.find(a=>a.id===id);if(a&&!a.got){a.got=day();save();draw()}}
function del(k,id){if(!confirm('Remove this?'))return;S[k]=S[k].filter(x=>x.id!==id);save();draw()}
function setGoal(v){S.goal=Math.max(0,+v||0);save();draw()}

function planned(){const m=day().slice(0,7);return S.tasks.filter(t=>t.done&&t.money&&(t.doneAt||'').startsWith(m)).reduce((a,t)=>a+t.money,0)}
const xb=(id,k)=>`<button class="x" aria-label="Remove" onclick="del('${k}','${id}')">✕</button>`;

const V={
hero(){const l=lvl(S.xp),p=planned(),g=S.goal;
 return `<div class="hero"><div class="cz">Adventurer</div><div class="lv">${l}</div>
 <div class="s">${S.xp} XP · ${need(l+1)-S.xp} to level ${l+1}</div>${bar(S.xp)}</div>
 <div class="row"><h2>Skills</h2><button onclick="openForm('skill')">New skill</button></div>
 ${S.skills.length?S.skills.map(k=>`<div class="card"><div class="b"><div class="row"><span class="t">${E(k.name)}</span><span class="cz">Lv ${lvl(k.xp)}</span></div>${bar(k.xp,'t')}</div>${xb(k.id,'skills')}</div>`).join(''):'<div class="empty">Add a skill like Cooking or Coding, then tie tasks and habits to it.</div>'}
 <h2>Planned earnings this month</h2>
 <div class="card"><div class="b"><div class="row"><span class="t">${p}${g?' / '+g:''}</span><span class="s">money from finished tasks</span></div>
 ${g?`<div class="bar r"><i style="width:${Math.min(100,Math.round(p/g*100))}%"></i></div>`:''}
 <label>Monthly goal (optional)<input type="number" min="0" inputmode="decimal" value="${g||''}" onchange="setGoal(this.value)"></label></div></div>
 <h2>Backup</h2><div class="row"><button onclick="exportData()">Export data</button><button onclick="document.getElementById('imp').click()">Import data</button></div>
 <input id="imp" type="file" accept="application/json" hidden onchange="importData(this)">
 <p class="s">Your progress lives only on this device. Export a copy now and then.</p>`},
tasks(){const open=S.tasks.filter(t=>!t.done),done=S.tasks.filter(t=>t.done);
 const item=t=>`<div class="card ${t.done?'done':''}">${t.done?'<span class="ico">✔</span>':`<button class="p" aria-label="Complete" onclick="doTask('${t.id}')">✓</button>`}
 <div class="b"><div class="t">${E(t.title)}</div><div class="s">${[t.project&&'📁 '+E(t.project),DIFF[t.diff],t.money&&'💰'+t.money,t.due&&'due '+E(t.due)].filter(Boolean).join(' · ')}</div></div>${xb(t.id,'tasks')}</div>`;
 const projs=[...new Set(open.map(t=>t.project||''))];
 return `<div class="row"><h2>Tasks</h2><button class="p" onclick="openForm('task')">New task</button></div>`+
 (open.length?projs.map(p=>`<div class="s">${p?E(p):'No project'}</div>`+open.filter(t=>(t.project||'')===p).map(item).join('')).join(''):'<div class="empty">No open tasks. Add one to earn XP.</div>')+
 (done.length?`<h2>Finished</h2>`+done.slice().reverse().slice(0,15).map(item).join(''):'')},
habits(){return `<div class="row"><h2>Habits</h2><button class="p" onclick="openForm('habit')">New habit</button></div>`+
 (S.habits.length?S.habits.map(h=>{const ok=h.last===day(),live=h.last===day()||h.last===yest();
 return `<div class="card ${ok?'done':''}">${ok?'<span class="ico">✔</span>':`<button class="p" aria-label="Check in" onclick="doHabit('${h.id}')">✓</button>`}
 <div class="b"><div class="t">${E(h.title)}</div><div class="s">🔥 ${live?h.streak:0}-day streak · best ${h.best} · ${DIFF[h.diff]}</div></div>${xb(h.id,'habits')}</div>`}).join(''):'<div class="empty">Add a habit and check in daily to build a streak.</div>')},
quests(){const pr=q=>{const n=q.conds.filter(met).length;return Math.round(n/q.conds.length*100)};
 const cn=c=>c.type==='task'?(S.tasks.find(t=>t.id===c.ref)||{}).title:c.type==='project'?'All of “'+c.ref+'”':'Streak '+c.n+': '+((S.habits.find(h=>h.id===c.ref)||{}).title);
 return `<div class="row"><h2>Quests</h2><button class="p" onclick="openForm('quest')">New quest</button></div>`+
 (S.quests.length?S.quests.map(q=>`<div class="card ${q.done?'done':''}" style="display:block"><div class="row"><span class="t cz">${E(q.name)}</span>${xb(q.id,'quests')}</div>
 <div class="s">${E(q.desc)}</div>${q.conds.map(c=>`<div class="s">${met(c)?'✔':'○'} ${E(cn(c))}</div>`).join('')}
 ${q.done?`<div class="s">Completed ${q.doneAt} · +50 XP</div>`:`<div class="bar"><i style="width:${pr(q)}%"></i></div>`}</div>`).join(''):'<div class="empty">A quest finishes by itself when its tasks, projects and habit streaks are done.</div>')},
ach(){return `<div class="row"><h2>Trophies</h2><button class="p" onclick="openForm('ach')">New trophy</button></div>`+
 (S.ach.length?S.ach.map(a=>`<div class="card"><span class="ico ${a.got?'':'lock'}">${E(a.icon||'🏆')}</span><div class="b"><div class="t">${E(a.name)}</div><div class="s">${E(a.desc)}</div>
 <div class="s">${a.got?'Earned '+a.got:a.quest?'Unlocks when its quest is complete':''}</div></div>
 ${!a.got&&!a.quest?`<button onclick="claim('${a.id}')">Claim</button>`:''}${xb(a.id,'ach')}</div>`).join(''):'<div class="empty">Trophies mark milestones. Link one to a quest or claim it by hand.</div>')}
};

function openForm(type){
 const q=$('#sheet');let h='';
 if(type==='skill')h=`<label>Skill name<input id="f1" required placeholder="Cooking"></label>`;
 if(type==='task')h=`<label>Task<input id="f1" required></label><label>Project (optional)<input id="f2" list="pl"></label><datalist id="pl">${[...new Set(S.tasks.map(t=>t.project).filter(Boolean))].map(p=>`<option value="${E(p)}">`).join('')}</datalist>
 <label>Difficulty<select id="f3">${diffOpts()}</select></label><label>Skill<select id="f4">${skillOpts()}</select></label>
 <label>Earns money (optional)<input id="f5" type="number" min="0" inputmode="decimal"></label><label>Due date (optional)<input id="f6" type="date"></label>`;
 if(type==='habit')h=`<label>Habit<input id="f1" required></label><label>Difficulty<select id="f3">${diffOpts()}</select></label><label>Skill<select id="f4">${skillOpts()}</select></label>`;
 if(type==='quest'){const pj=[...new Set(S.tasks.map(t=>t.project).filter(Boolean))];
  h=`<label>Quest name<input id="f1" required placeholder="Home, sweet home"></label><label>Story<textarea id="f2" rows="2"></textarea></label><label>Finish when all of these are done</label>`+
  S.tasks.filter(t=>!t.done).map(t=>`<div class="chk"><input type="checkbox" data-t="task" data-r="${t.id}">Task: ${E(t.title)}</div>`).join('')+
  pj.map(p=>`<div class="chk"><input type="checkbox" data-t="project" data-r="${E(p)}">Project: ${E(p)}</div>`).join('')+
  S.habits.map(x=>`<div class="chk"><input type="checkbox" data-t="habit" data-r="${x.id}">Habit: ${E(x.title)}<input class="n" type="number" min="1" value="7" aria-label="Streak days"></div>`).join('')+
  (S.tasks.length+S.habits.length?'':'<div class="s">Create tasks or habits first.</div>')}
 if(type==='ach')h=`<label>Trophy name<input id="f1" required></label><label>Description<input id="f2"></label><label>Icon (emoji)<input id="f3" maxlength="4" value="🏆"></label>
  <label>Unlock with quest<select id="f4"><option value="">Claim by hand</option>${S.quests.map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join('')}</select></label>`;
 q.innerHTML=`<form onsubmit="return submit_('${type}',event)">${h}<div class="row" style="margin-top:14px"><button type="button" onclick="closeF()">Cancel</button><button class="p" type="submit">Save</button></div></form>`;
 q.classList.add('on');const f=$('#f1');if(f)f.focus()}
function closeF(){$('#sheet').classList.remove('on')}
const g=i=>{const e=$('#'+i);return e?e.value.trim():''};
function submit_(type,ev){ev.preventDefault();
 if(type==='skill')S.skills.push({id:uid(),name:g('f1'),xp:0});
 if(type==='task')S.tasks.push({id:uid(),title:g('f1'),project:g('f2'),diff:+g('f3'),skill:g('f4'),money:+g('f5')||0,due:g('f6'),done:false});
 if(type==='habit')S.habits.push({id:uid(),title:g('f1'),diff:+g('f3'),skill:g('f4'),streak:0,best:0,last:''});
 if(type==='quest'){const conds=[...document.querySelectorAll('#sheet [data-t]:checked')].map(c=>({type:c.dataset.t,ref:c.dataset.r,n:+(c.parentNode.querySelector('.n')||{}).value||0}));
  if(!conds.length){alert('Pick at least one condition.');return false}
  S.quests.push({id:uid(),name:g('f1'),desc:g('f2'),conds,done:false})}
 if(type==='ach')S.ach.push({id:uid(),name:g('f1'),desc:g('f2'),icon:g('f3'),quest:g('f4'),got:''});
 check();save();closeF();draw();return false}
function exportData(){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
 const a=document.createElement('a');a.href=u;a.download='life-quest-'+day()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importData(i){const f=i.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tasks)||!Array.isArray(d.skills))throw 0;
  if(!confirm('Replace everything with this backup?'))return;S=Object.assign({tasks:[],habits:[],quests:[],ach:[],skills:[],goal:0,xp:0},d);save();draw()}
  catch(e){alert('That file is not a Life Quest backup.')}i.value=''};r.readAsText(f)}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
function draw(){$('#v').innerHTML=V[tab]();
 $('#nav').innerHTML=TABS.map(([k,n])=>`<button ${k===tab?'aria-current="true"':''} onclick="tab='${k}';draw();scrollTo(0,0)">${n}</button>`).join('')}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeF()});
check();draw();
</script></body></html>
